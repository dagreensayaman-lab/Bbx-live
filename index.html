<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BBX Live — Cours collectif</title>
<meta name="theme-color" content="#29AADC">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#29AADC; --card:#fff; --pink:#F06EA0; --yellow:#F5E44A; --purple:#9B8EC4; --cyan:#7DD9F0;
  --dark:#1a2a3a; --muted:#7aafc8; --border:#c8e8f4; --soft:#eef8fc; --green:#00c87a;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--dark);font-family:'Nunito Sans',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,.15) 1.5px,transparent 1.5px);background-size:22px 22px;pointer-events:none;z-index:0}
body>*{position:relative;z-index:1}
h1,h2,h3,.f{font-family:'Nunito',sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;border-radius:50px;padding:10px 18px;font-family:'Nunito',sans-serif;font-weight:800;background:#fff;color:var(--dark);box-shadow:0 3px 0 rgba(0,0,0,.15);transition:transform .06s,box-shadow .06s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
button:disabled{opacity:.4;cursor:default}
.b-pink{background:var(--pink);color:#fff}.b-yellow{background:var(--yellow)}.b-cyan{background:var(--cyan)}.b-purple{background:var(--purple);color:#fff}.b-ghost{background:var(--soft);box-shadow:none}
.b-xl{font-size:1.25rem;padding:14px 26px}
.mini{padding:5px 11px;font-size:.8rem;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.card{background:#fff;border-radius:20px;box-shadow:0 4px 0 rgba(0,0,0,.12);padding:16px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.muted{color:var(--muted)} .small{font-size:.8rem}
.sec{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.85);margin:4px 2px 8px;font-weight:700}
.sec.dark{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:50px;background:rgba(255,255,255,.25);color:#fff;font-weight:800;font-size:.75rem;font-family:'Nunito',sans-serif;white-space:nowrap}
.chip.w{background:#fff;color:var(--dark)}
.dot{width:8px;height:8px;border-radius:50%;background:#ffd34d}.dot.ok{background:var(--green)}
.logo{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.6rem;line-height:1;color:#fff;text-shadow:3px 3px 0 rgba(0,0,0,.15);letter-spacing:.02em;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.logoav{width:46px;height:46px;border-radius:50%;border:3px solid #fff;object-fit:cover;box-shadow:0 3px 0 rgba(0,0,0,.15);background:#FFB74F;flex:none}
.join .logo{flex-direction:column;gap:10px}.join .logoav{width:130px;height:130px;border-width:5px}
.esh{width:min(220px,55vw);height:auto;display:block;margin:0 auto;animation:eshpop 2.4s ease-in-out infinite;transform-origin:20% 90%}
@keyframes eshpop{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.05)}}
.bgchibi{position:fixed;right:10px;bottom:0;width:min(30vw,260px);height:auto;pointer-events:none;z-index:0;opacity:.95}
@media (max-width:640px){.bgchibi{width:42vw;opacity:.9}}
.logo .p{color:var(--cyan)}.logo .t{color:var(--pink)}.logo .k{color:var(--yellow)}
.logo small{font-size:.55em;color:#fff;margin-left:6px;letter-spacing:.12em}
.top{display:flex;align-items:center;gap:8px;padding:12px 16px;flex-wrap:wrap}
.icon{width:40px;height:40px;padding:0;border-radius:50%;font-size:1.1rem}
.fxbox{background:var(--soft);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.fxs{display:grid;grid-template-columns:90px 1fr 64px;align-items:center;gap:8px;font-weight:800;font-size:.85rem}.fxs input{accent-color:var(--pink);width:100%}.fxs b{text-align:right;font-family:'Nunito',sans-serif}
#recin{max-height:92vh;overflow:auto}
.alertbox{background:#fff7d6;border-radius:12px;padding:8px 10px;margin-top:8px;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.alertbox.red{background:#ffe3e6;display:block}
.roster{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.rrow{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:10px;background:var(--soft)}
.rrow.off{opacity:.5}.rname{flex:1;font-weight:700;font-size:.9rem;min-width:0;overflow:hidden;text-overflow:ellipsis}
.odot{width:10px;height:10px;border-radius:50%;background:#c5d6de;flex:none}.odot.on{background:var(--green)}
.vbanner{position:fixed;top:0;left:0;right:0;z-index:60;background:var(--yellow);color:var(--dark);font-family:'Nunito',sans-serif;font-weight:900;text-align:center;padding:12px 52px 12px 16px}
.vbx{position:absolute;top:50%;right:10px;transform:translateY(-50%);width:32px;height:32px;padding:0;border-radius:50%;background:#fff;font-size:.9rem}
.tabpal .spick{gap:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 18px;border-radius:50px;font-weight:700;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}

/* ---------- STAGE (écran élève) ---------- */
.stage{min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:22px 14px;position:relative;overflow:hidden}
.stage .stephead{position:absolute;top:12px;left:14px;right:14px;display:flex;gap:8px;align-items:center;font-family:'Nunito',sans-serif;font-weight:800;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stephead .n{background:var(--soft);color:var(--dark);border-radius:50px;padding:2px 9px}
.kicker{font-family:'Nunito',sans-serif;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-size:.85rem;margin-top:22px}
.big{font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(3.2rem,15vw,7.5rem);line-height:1}
.big.count{color:var(--pink)}
.h1{font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(1.7rem,6.5vw,3rem);line-height:1.1}
.h2{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(1.1rem,4vw,1.5rem)}
.consigne{font-size:clamp(1rem,3.6vw,1.25rem);max-width:620px;font-weight:600}
.timer{font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(2.6rem,11vw,5rem);color:var(--pink);font-variant-numeric:tabular-nums}
.bar{width:100%;max-width:520px;height:12px;background:var(--soft);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));border-radius:10px}
.tourtag{font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(1.1rem,4.4vw,1.6rem);background:var(--c);color:#fff;border-radius:50px;padding:5px 18px;margin-top:22px;text-shadow:1px 1px 0 rgba(0,0,0,.15)}
.bigson{font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(2.4rem,10vw,4.5rem);line-height:1;background:var(--c);color:#fff;border-radius:22px;padding:6px 22px;text-shadow:2px 2px 0 rgba(0,0,0,.15);min-width:110px}
.tag{display:inline-block;font-family:'Nunito',sans-serif;font-weight:900;background:var(--c,var(--soft));color:#fff;border-radius:12px;padding:2px 12px;text-shadow:1px 1px 0 rgba(0,0,0,.15)}
.letters{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.letters .tag{font-size:clamp(1.6rem,7vw,2.8rem);padding:6px 18px;border-radius:18px}
.banner{font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(2rem,9vw,4rem);padding:8px 26px;border-radius:24px;line-height:1.1}
.banner.prof{background:#ffe3ee;color:var(--pink)}
.banner.vous{background:var(--yellow);color:var(--dark);animation:pop .3s}
@keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}
.pausebadge{position:absolute;top:44px;right:14px;background:var(--yellow);border-radius:50px;padding:4px 12px;font-family:'Nunito',sans-serif;font-weight:900}
.pulse{width:26px;height:26px;border-radius:50%;background:var(--soft);transition:background .05s}
.pulse.on{background:var(--cyan)}.pulse.on.one{background:var(--pink)}
.pulse.xl{width:110px;height:110px}
.list{list-style:none;display:flex;flex-direction:column;gap:6px;width:100%;max-width:460px;text-align:left}
.list li{background:var(--soft);border-radius:14px;padding:8px 14px;display:flex;gap:10px;font-weight:700}
.list li b{font-family:'Nunito',sans-serif}
.list li .sp{flex:1}
.tips{background:var(--soft);border-radius:18px;padding:12px 16px;text-align:left;max-width:520px;width:100%}
.tips ol{padding-left:20px;display:flex;flex-direction:column;gap:4px;font-weight:600}
.people{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:620px}
.people span{background:var(--soft);border-radius:50px;padding:3px 11px;font-weight:700;font-size:.85rem}


/* grille */
.grid{display:flex;flex-direction:column;gap:8px;width:100%;max-width:780px}
.glabel{font-family:'Nunito',sans-serif;font-weight:800;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;text-align:left}
.mrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.beat{display:flex;gap:3px;background:var(--soft);border-radius:14px;padding:4px}
.cell{flex:1;min-width:0;aspect-ratio:1/1.15;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--c);color:#fff;font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(.7rem,3vw,1.5rem);text-shadow:1px 1px 0 rgba(0,0,0,.18);transition:transform .06s;overflow:hidden}
.d1 .cell,.d2 .cell{font-size:clamp(1rem,4.6vw,2.1rem)}
.cell.sil{background:transparent;color:#b5d6e4;text-shadow:none}
.cell.cur{transform:scale(1.16);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--dark);position:relative;z-index:2}
.cell.sil.cur{background:#fff}
.grid.small .cell{font-size:clamp(.6rem,2.2vw,1rem)}
.grid.small{max-width:520px;opacity:.85}
.d3 .cell{font-size:clamp(.85rem,3.8vw,1.8rem)}
@media (max-width:560px){.d4 .mrow,.d3 .mrow{grid-template-columns:repeat(2,1fr)}.d4 .cell,.d3 .cell{font-size:clamp(.95rem,4.6vw,1.4rem)}}

/* ---------- ÉLÈVE ---------- */
.stu{max-width:820px;margin:0 auto;padding:0 12px 40px}
.join{max-width:460px;margin:0 auto;padding:40px 16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.join .logo{font-size:2.6rem;text-align:center}
.join .card{width:100%;display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.8rem;color:var(--muted);flex:1;min-width:140px}
.fld.sm{flex:0 1 150px;min-width:110px}
.fld input,.fld select,.fld textarea{border:2px solid var(--border);border-radius:12px;padding:8px 11px;font-weight:700;color:var(--dark);background:#fff;font-size:.95rem;width:100%}
.fld textarea{resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--cyan)}
.lvlpick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.lvtag{display:inline-block;background:var(--c);color:#fff;border-radius:50px;padding:2px 10px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.72rem;letter-spacing:.04em;text-transform:none}
.lvlpick button{border-radius:16px;padding:12px 8px;background:var(--soft);box-shadow:none;border:3px solid transparent}
.lvlpick button.on{border-color:var(--c);background:#fff;color:var(--c)}
.lvlpick small{display:block;font-weight:600;font-family:'Nunito Sans',sans-serif;color:var(--muted);font-size:.72rem}
.calbar input[type=range]{width:100%;accent-color:var(--pink)}
.sheet{position:fixed;inset:0;background:rgba(26,42,58,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet .card{width:100%;max-width:480px;border-radius:24px 24px 0 0;margin:0;padding:20px;display:flex;flex-direction:column;gap:14px}
.chk{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--pink)}

/* ---------- PROF ---------- */
.ptabs{display:flex;gap:6px}
.ptabs button{background:rgba(255,255,255,.25);color:#fff;box-shadow:none;padding:8px 16px}
.ptabs button.on{background:#fff;color:var(--dark)}
.profwrap{display:grid;grid-template-columns:380px 1fr;gap:16px;padding:0 16px 30px;align-items:start}
@media (max-width:920px){.profwrap{grid-template-columns:1fr}}
.ctl .h2{margin:2px 0 10px}
#ctl-quick .fld{flex:none}
.ctl .bigbtns{display:flex;gap:8px;margin-bottom:10px}
.ctl .bigbtns button{flex:1}.ctl .bigbtns .b-xl{flex:2}
.bpm{display:flex;align-items:center;gap:8px}
.bpm b{font-family:'Nunito',sans-serif;font-size:1.5rem;min-width:110px;text-align:center}
.steps{list-style:none;display:flex;flex-direction:column;gap:4px}
.steps li{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:12px;cursor:pointer;font-weight:700;font-size:.9rem}
.steps li:hover{background:var(--soft)}
.steps li.on{background:#fff5f9;outline:2px solid var(--pink)}
.steps li .n{width:22px;height:22px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-family:'Nunito',sans-serif;font-weight:900;flex:none}
.steps li.done .n{background:var(--green);color:#fff}
.steps li .d{margin-left:auto;color:var(--muted);font-size:.8rem}
.clock{font-family:'Nunito',sans-serif;font-weight:900;color:#fff;font-variant-numeric:tabular-nums}
.linkbox{display:flex;gap:6px}
.linkbox input{flex:1;min-width:0;border:2px solid var(--border);border-radius:12px;padding:6px 10px;font-size:.8rem}
.edwrap{max-width:1180px;margin:0 auto;padding:0 16px 40px;display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.outline{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;margin:0}
.outline .steps li{padding:6px 6px;gap:6px;font-size:.85rem}
.outline .steps li .d{margin-left:auto}
.outline .ud{display:flex;gap:2px}.outline .ud .mini{padding:2px 7px;font-size:.75rem}
.outline li.off2{opacity:.5}.outline li.off2 .n,.outline li.off2{text-decoration:line-through}
.onoff.sm{width:34px;height:20px}.onoff.sm i{width:14px;height:14px}.onoff.sm.on i{left:17px}
.b-del{background:#ff5a6e;color:#fff}
.mini.b-yellow{background:var(--yellow);color:var(--dark)}
.outline .grip{cursor:grab;color:var(--muted);font-size:1.1rem;padding:0 2px;touch-action:none;user-select:none}
.outline .steps li{cursor:grab;user-select:none;position:relative}
.outline .steps li .tt{flex:1;min-width:0}
.outline .steps li.dragging{background:#fff5f9;outline:2px solid var(--pink);z-index:5;cursor:grabbing;box-shadow:0 6px 14px rgba(0,0,0,.15)}
.outline .steps li.dropbefore::before,.outline .steps li.dropafter::after{content:'';position:absolute;left:4px;right:4px;height:4px;border-radius:4px;background:var(--pink)}
.outline .steps li.dropbefore::before{top:-4px}.outline .steps li.dropafter::after{bottom:-4px}
body.nosel{user-select:none;cursor:grabbing}
.ed.flash{box-shadow:0 0 0 4px var(--yellow),0 4px 0 rgba(0,0,0,.12)}
.ed{scroll-margin-top:12px}
@media (max-width:900px){.edwrap{grid-template-columns:1fr}.outline{position:static;max-height:none}}
.beats4{display:flex;gap:10px}.beats4 span{width:64px;height:64px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-weight:900;font-size:1.8rem;color:var(--muted)}
.beats4 span.on{background:var(--cyan);color:#fff}.beats4 span.one.on{background:var(--pink);transform:scale(1.15)}
.ed .edhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ed .edhead b{font-family:'Nunito',sans-serif;font-size:1.05rem}
.ed .type{border-radius:50px;padding:2px 10px;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;background:var(--soft)}
.ed .fields{display:flex;flex-direction:column;gap:10px}
.sub{background:var(--soft);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.hint{font-size:.8rem;color:var(--muted);font-weight:600}
.paliers{display:flex;gap:6px}.paliers i{width:34px;height:8px;border-radius:6px;background:var(--soft)}.paliers i.on{background:var(--c)}.paliers i.done{background:var(--c);opacity:.45}
.tabmsg{font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(1.1rem,4.6vw,1.7rem);color:var(--dark);max-width:640px}
.tabmsg.last{color:#fff;background:var(--c);border-radius:18px;padding:6px 16px;animation:pop .3s}
.tabed{background:#fff;border:2px solid var(--border);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.tabed .srow{max-width:640px}
.spick{display:flex;flex-direction:column;gap:6px}
.schip{display:inline-flex;align-items:center;background:var(--c);border-radius:50px;padding:2px 2px 2px 4px;color:#fff;font-family:'Nunito',sans-serif;font-weight:900}
.schip b,.schip .go{padding:4px 8px;font-size:1rem;background:transparent;color:#fff;box-shadow:none;text-shadow:1px 1px 0 rgba(0,0,0,.15)}
.schip .x{width:24px;height:24px;padding:0;border-radius:50%;background:rgba(255,255,255,.35);color:#fff;box-shadow:none;font-size:.7rem}
.schip.now{outline:3px solid var(--dark);transform:scale(1.06)}
.pal.sm{padding:3px 10px;font-size:.8rem;opacity:.85}
.itemnav{margin:10px 0 4px}.itemnav .mini{flex:1}
#ctlnow{min-height:1.1em;margin-bottom:4px}
.palette{background:#fff;border:2px solid var(--border);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;position:sticky;top:8px;z-index:6;box-shadow:0 6px 14px rgba(26,42,58,.12)}
.pal{background:var(--c);color:#fff;font-family:'Nunito',sans-serif;font-weight:900;padding:6px 13px;font-size:1rem;text-shadow:1px 1px 0 rgba(0,0,0,.15);border:3px solid transparent}
.pal.sil{background:var(--soft);color:var(--muted);text-shadow:none}
.pal.on{border-color:var(--dark);transform:scale(1.08)}
.addnota{display:inline-flex;gap:4px}.addnota input{width:62px;border:2px solid var(--border);border-radius:50px;padding:5px 10px;font-weight:800}
.lvtabs .mini{color:var(--c)}.lvtabs .mini.on{background:var(--c);color:#fff}
.seq{display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.sbeat{display:flex;gap:3px;background:#fff;border-radius:12px;padding:4px;position:relative;padding-top:16px}
.sbeat .bn{position:absolute;top:1px;left:7px;font-size:.62rem;font-weight:800;color:var(--muted);font-family:'Nunito',sans-serif}
.scell{flex:1;min-width:0;height:42px;padding:0;border-radius:9px;background:var(--c);color:#fff;font-family:'Nunito',sans-serif;font-weight:900;font-size:.95rem;box-shadow:none;text-shadow:1px 1px 0 rgba(0,0,0,.15);overflow:hidden}
.scell.play{transform:scale(1.12);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--dark);position:relative;z-index:2}
.scell.add{box-shadow:0 0 0 3px var(--yellow) inset}
.scell.sil{background:var(--soft);color:#a9cddd;text-shadow:none}
.scell:hover{outline:2px solid var(--dark)}
@media (max-width:640px){.srow.d4{grid-template-columns:repeat(2,1fr)}}
.ed.off{opacity:.55}.ed.off .fields{display:none}
.onoff{width:44px;height:26px;padding:0;border-radius:50px;background:#d5e6ee;box-shadow:none;position:relative;flex:none}
.onoff i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.onoff.on{background:var(--green)}.onoff.on i{left:21px}
.steps li.off{opacity:.45;cursor:default;text-decoration:line-through}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:3px;animation:fall linear infinite;opacity:.9}
@keyframes fall{to{transform:translateY(720px) rotate(540deg)}}

const Z = { lips:'#F06EA0', tf:'#5CC8E8', tb:'#9B8EC4', throat:'#F5A623' };
const SOUND_COLORS = { P:Z.lips, B:Z.lips, Pch:Z.lips, Pf:Z.lips, Fsh:Z.lips, Spt:Z.lips,
  Ts:Z.tf, T:Z.tf, t:'#8fd9ee', 'Ts~':Z.tf, 'Th~':Z.tf,
  K:Z.tb, 'K~':Z.tb, k:Z.tb, L:Z.tb };
const isSil = t => !t || t === '.' || t === '-' || t === '_';
function colorOf(t){
  if(isSil(t)) return null;
  if(SOUND_COLORS[t]) return SOUND_COLORS[t];
  let h = 0; for(const c of t) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `hsl(${h} 65% 62%)`;
}
// Notations connues : sert à découper « PTKT » en P T K T si on oublie les espaces
const BASE_NOTAS = ['P','B','Ts','T','t','K~','K','k','L','Pch','Pf','Ts~','Th~','Fsh','Spt'];
let EXTRA_NOTAS = LS.get('bbx-notas', []);
function splitChunk(c){
  if(isSil(c)) return ['.'];
  const known = [...BASE_NOTAS, ...EXTRA_NOTAS, '.', '-', '_'];
  if(known.includes(c)) return [c];
  const list = known.slice().sort((a, b) => b.length - a.length), out = [];
  let i = 0;
  while(i < c.length){ const m = list.find(n => c.startsWith(n, i)); if(!m) return [c]; out.push(m); i += m.length; }
  return out;
}
const parseGrid = s => String(s || '').trim().split(/\s+/).filter(Boolean).flatMap(splitChunk).map(t => isSil(t) ? '.' : t);
const sonsList = s => parseGrid(s).filter(t => t !== '.');
const phDiv = p => [2, 3, 4].includes(+p.div) ? +p.div : 2;
const phMes = p => Math.max(1, +p.mesures || 1);
const phSrc = (p, l) => l >= 3 && (p.niv3 || '').trim() ? p.niv3 : l >= 2 && (p.niv2 || '').trim() ? p.niv2 : p.niv1;
function phraseGrids(p){ const m = phMes(p), d = phDiv(p); return { 1:fitGrid(phSrc(p, 1), m, d), 2:fitGrid(phSrc(p, 2), m, d), 3:fitGrid(phSrc(p, 3), m, d) }; }
function fitGrid(str, m, d){
  let tok = parseGrid(str); const need = m * 4;
  const div = d ? +d : Math.max(1, Math.min(4, Math.round(tok.length / need) || 2));
  const total = need * div; tok = tok.slice(0, total); while(tok.length < total) tok.push('.');
  return { tok, div };
}

function makePreset(min){
  const c = { 15:[[30,30,30],'P K~',30,60,3,1,2,1], 30:[[60,60,60],'P Ts K~',60,90,4,2,3,2], 45:[[60,60,60,60],'P Ts K~ Pch',60,120,6,3,6,2], 60:[[90,60,90,60],'P Ts K~ Pch L',60,180,8,3,10,2] }[min] || [[60,60,60],'P Ts K~',2,90,4,2,3,2];
  const [wu, sons, mes, free, nq, acc, mic, cal] = c;
  const steps = [
    { ...DEF.accueil(), duree:acc },
    { ...DEF.calage(), duree:cal },
    { type:'echauffement', exercices:wu.map((d, i) => ({ ...WU_BANK[i % WU_BANK.length], duree:d })) },
    { ...DEF.tabata(), sons, duree:mes },
    { ...DEF.freestyle(), lettres:sons, duree:free },
    { ...DEF.qr(), phrases:DEFAULT_PHRASES.slice(0, nq).map(p => ({ ...p })) },
  ];
  if(mic) steps.push({ ...DEF.micro(), duree:mic });
  steps.push({ ...DEF.faq(), duree:min <= 15 ? 3 : 5 });

  return { titre:`Cours ${min} min`, steps };

function normStep(s){
  if(!s || !DEF[s.type]) return null;
  const d = DEF[s.type](); const o = { ...d, ...s };
  o.off = !!s.off;
  if(o.type === 'echauffement') o.exercices = arr(o.exercices).map(e => ({ nom:'', consigne:'', duree:60, ...e }));
  if(o.type === 'tabata'){
    o.blocs = arr(s.blocs ?? d.blocs).filter(k => BLOCS[k]); if(!o.blocs.length) o.blocs = d.blocs;
    if(![30,60,90,120].includes(+o.duree)) o.duree = 60;
    delete o.mesures; delete o.repos; delete o.remplissage;
  }
  if(o.type === 'qr') o.phrases = arr(o.phrases).map(p => { const q = { mesures:1, div:2, niv1:'', niv2:'', niv3:'', reps:+o.reps || 2, ...p }; if(OLD_NIV2.some(x => (q.niv2 || '').trim().startsWith(x))) q.niv2 = ''; return q; });
  return o;
}

  controle:{ pats:{ 1:['2:X.X.X.X.','2:X.X.X.X.','2:X.X.X.X.'], 2:['2:XXXXXXXX','2:XXXXXXXX','2:XXXXXXXX'], 3:['2:XXXXXXXX','2:XXXXXXXX','2:XXXXXXXX'] },
    msgs:['Même son, même volume, même note, pile sur le temps.', 'Concentre-toi sur ton souffle. Sois précis.', 'Encore un petit effort, garde la qualité !'], last:'Plus que 10 secondes : reste précis !' },
  puissance:{ pats:{ 1:['2:X.X.X.X.','2:X.X.X.X.','2:X.X.X.X.'], 2:['2:XXXXXXXX','2:XXXXXXXX','2:XXXXXXXX'], 3:['2:XXXXXXXX','2:XXXXXXXX','2:XXXXXXXX'] },
    msgs:['Pousse ! Muscle tes lèvres, ta langue, ta gorge.', 'Encore plus fort !', 'Donne tout pour la fin !'], last:'Plus que 10 secondes : DONNE TOUT ce que tu as !' },
  rapidite:{ pats:{ 1:['2:XX..XX..','2:XXXXXX..','4:XXX.....XXX.....'], 2:['2:XXXXXXXX','4:XXX.....XXX.....','4:XXX.XXX.XXX.....'], 3:['4:XXX.....XXX.....','4:XXX.XXX.XXX.....','4:XXX.XXX.XXX.XXX.'] },
    msgs:['Enchaîne vite, mais garde l\'espace entre les sons.', 'Plus serré, reste net !', 'Dernier palier, vas-y !'], last:'Plus que 10 secondes, lâche rien !' },
};
const PALIERS = 3;
const patKey = (son, tour, pal, lvl) => (son ? son + '__' : '') + tour + '_' + pal + '_' + lvl;
function tabPat(step, son, tour, pal, lvl){ const o = step.pats || {}; return (son && o[patKey(son, tour, pal, lvl)]) || o[patKey('', tour, pal, lvl)] || TAB_DEF[tour].pats[lvl][pal]; }
function patGrid(str, son){
  const [d, pt] = String(str).split(':'); const div = [1,2,3,4].includes(+d) ? +d : 2;
  let tok = (pt || '').split('').map(c => c === 'X' ? son : '.'); const need = 4 * div;
  tok = tok.slice(0, need); while(tok.length < need) tok.push('.');
  return { tok, div };
}
function tabMsg(step, tour, pal){ const v = (step.msgs || {})[tour + '_' + pal]; return v != null && v !== '' ? v : (pal === 'last' ? TAB_DEF[tour].last : TAB_DEF[tour].msgs[pal]); }
// change de résolution en gardant les sons au même endroit dans le temps
function remapTok(tok, od, nd, beats){
  const out = [];
  for(let n = 0; n < beats * nd; n++){ const m = n * od / nd; out.push(Math.abs(m - Math.round(m)) < 1e-6 && tok[Math.round(m)] !== undefined ? tok[Math.round(m)] : '.'); }
  return out;
}
function tabG(S, bloc, lvl){
  const pat = { controle:['S...S...S...S...','S.S.S.S.S.S.S.S.','SSSSSSSSSSSSSSSS'], puissance:['S...S...S...S...','S.S.S.S.S.S.S.S.','SSSSSSSSSSSSSSSS'], rapidite:['S.S.S.S.S.S.S.S.','SSSSSSSSSSSSSSSS','SSSSSSSSSSSSSSSS'] }[bloc][Math.min(3, lvl) - 1];
  return { tok:pat.split('').map(c => c === 'S' ? S : '.'), div:4 };
}
const tlCache = new Map();
function getTL(step){
  const k = JSON.stringify(step); let t = tlCache.get(k);
  if(!t){ t = buildTL(step); if(tlCache.size > 60) tlCache.clear(); tlCache.set(k, t); }
  return t;
}
function buildTL(s){
  const segs = []; let b = 0;
  const add = (len, o) => { segs.push({ start:b, len, ...o }); b += len; };
  if(s.type === 'echauffement'){
    const ex = arr(s.exercices);
    ex.forEach((e, i) => { add(5, { kind:'prep', i, n:ex.length, ex:e }); add(Math.max(5, +e.duree || 60), { kind:'timer', i, n:ex.length, ex:e }); });
  } else if(s.type === 'tabata'){
    const sons = sonsList(s.sons), blocs = arr(s.blocs).filter(x => BLOCS[x]), bpm = +s.bpm || 90;
    const palLen = Math.max(4, Math.round((+s.duree || 60) * bpm / 60 / PALIERS / 4) * 4);
    const rest = Math.max(4, Math.round(REPOS_TABATA * bpm / 60 / 4) * 4);
    const G = (so, bk, pal) => ({ 1:patGrid(tabPat(s, so, bk, pal, 1), so), 2:patGrid(tabPat(s, so, bk, pal, 2), so), 3:patGrid(tabPat(s, so, bk, pal, 3), so) });
    const items = []; blocs.forEach((bk, ti) => sons.forEach((so, si) => items.push({ bk, ti, so, si })));
    if(items.length){
      add(4, { kind:'count', preview:G(items[0].so, items[0].bk, 0), bloc:items[0].bk, ti:0, nt:blocs.length });
      items.forEach((it, k) => {
        const s0 = b, s1 = b + PALIERS * palLen;
        for(let pal = 0; pal < PALIERS; pal++) add(palLen, { kind:'grid', son:it.so, si:it.si, ns:sons.length, bloc:it.bk, ti:it.ti, nt:blocs.length, pal, sStart:s0, sEnd:s1, grids:G(it.so, it.bk, pal) });
        const nx = items[k + 1];
        if(nx) add(rest, { kind:'rest', next:nx.so, bloc:nx.bk, ti:nx.ti, nt:blocs.length, newTour:nx.ti !== it.ti, preview:G(nx.so, nx.bk, 0) });
      });
    }
  } else if(s.type === 'freestyle'){
    add(4, { kind:'count' });
    const d = +s.duree || 0;
    add(d > 0 ? Math.max(4, Math.round(d * (+s.bpm || 90) / 60 / 4) * 4) : Infinity, { kind:'free' });
  } else if(s.type === 'qr'){
    const ph = arr(s.phrases);
    ph.forEach((p, pi) => {
      const m = phMes(p), grids = phraseGrids(p), reps = Math.max(1, +p.reps || +s.reps || 2);
      const next = ph[pi + 1] ? phraseGrids(ph[pi + 1]) : null;
      add(4, { kind:'count', preview:grids, pi, np:ph.length });
      for(let r = 0; r < reps; r++){
        add(m * 4, { kind:'prof', grids, pi, np:ph.length, r, reps });
        add(m * 4, { kind:'vous', grids, pi, np:ph.length, r, reps, next:r === reps - 1 ? next : null });
      }
    });
  } else if(s.type === 'qrlibre'){
    const m = Math.max(1, +s.mesures || 1), n = Math.max(1, +s.tours || 8);
    add(4, { kind:'count' });
    for(let r = 0; r < n; r++){ add(m * 4, { kind:'prof', r, reps:n, m }); add(m * 4, { kind:'vous', r, reps:n, m }); }
  } else if(s.type === 'calage'){
    add(Infinity, { kind:'calage' });
  }
  return { segs, total:b };
}
function findSeg(tl, b){ for(let i = 0; i < tl.segs.length; i++){ const s = tl.segs[i]; if(b >= s.start && b < s.start + s.len) return i; } return -1; }
function stepSeconds(s){
  if(s.type === 'echauffement') return getTL(s).total;
  if(s.type === 'tabata' || s.type === 'qr' || s.type === 'qrlibre') return getTL(s).total * 60 / (+s.bpm || 90);
  if(s.type === 'freestyle') return (+s.duree || 0) + 4 * 60 / (+s.bpm || 90);
  return (+s.duree || 0) * 60;
}

/* ---------- synchronisation ---------- */
function loadScript(src){ return new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error('script Firebase bloqué ou introuvable')); document.head.appendChild(s); setTimeout(() => ko(new Error('délai dépassé en chargeant Firebase')), 10000); }); }
const Sync = {
  mode:FIREBASE_CONFIG ? 'firebase' : 'local', offset:0, connected:false, h:{ state:[], plan:[], parts:[], sounds:[] },
  on(ev, f){ this.h[ev].push(f); }, emit(ev, v){ this.h[ev].forEach(f => f(v)); },
  now(){ return Date.now() + this.offset; },
  async init(){
    if(this.mode === 'firebase'){
      try{ await this.initFB(); return; }
      catch(e){ console.error(e); this.fbError = (e && (e.message || e.type)) || 'chargement impossible'; this.mode = 'local'; toast('Connexion en ligne impossible : ' + this.fbError); }
    }
    this.initLocal();
  },
  /* --- mode test local : onglets du même navigateur --- */
  initLocal(){
    const ch = this.ch = 'bbxlive-' + ROOM; this.seen = new Set(); this.partsMap = {};
    try{ this.bc = new BroadcastChannel(ch); this.bc.onmessage = e => this.recv(e.data); }catch(e){}
    addEventListener('storage', e => { if(e.key === ch + '-msg' && e.newValue){ try{ this.recv(JSON.parse(e.newValue)); }catch(_){} } });
    this.connected = true;
    if(!IS_PROF){ const p = LS.get(ch + '-plan', null), s = LS.get(ch + '-state', null), so = LS.get(ch + '-sounds', null); if(so) this.emit('sounds', so); if(p) this.emit('plan', p); if(s) this.emit('state', s); }
    else setInterval(() => this.pruneParts(), 3000);
  },
  send(m){ m._id = Math.random().toString(36).slice(2); m._from = MY_ID; try{ this.bc && this.bc.postMessage(m); }catch(e){} try{ localStorage.setItem(this.ch + '-msg', JSON.stringify(m)); }catch(e){} },
  recv(m){
    if(!m || m._from === MY_ID || this.seen.has(m._id)) return;
    this.seen.add(m._id); if(this.seen.size > 500) this.seen = new Set();
    if(!IS_PROF){
      if(m.t === 'state') this.emit('state', m.v);
      else if(m.t === 'sounds') this.emit('sounds', m.v);
      else if(m.t === 'plan') this.emit('plan', m.v);
      else if(m.t === 'parts') this.emit('parts', m.v);
    } else if(m.t === 'hello'){
      const isNew = !this.partsMap[m.id];
      this.partsMap[m.id] = { id:m.id, name:m.name, level:m.level, v:m.v, seen:Date.now() };
      if(isNew){ this.send({ t:'sounds', v:CUSTOM }); this.send({ t:'plan', v:S.plan }); this.send({ t:'state', v:S.state }); }
      this.publishParts();
    } else if(m.t === 'bye'){ delete this.partsMap[m.id]; this.publishParts(); }
  },
  pruneParts(){ const n = Date.now(); for(const k in this.partsMap) if(n - this.partsMap[k].seen > 10000) delete this.partsMap[k]; this.publishParts(); },
  publishParts(){ const list = Object.values(this.partsMap).map(({ id, name, level, v }) => ({ id, name, level, v })); this.emit('parts', list); this.send({ t:'parts', v:list }); },
  /* --- mode en ligne : Firebase (base + comptes) --- */
  async initFB(){
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js');
    // une « app » séparée pour le prof et pour l'élève : on peut tester les deux dans le même navigateur
    const app = firebase.initializeApp(FIREBASE_CONFIG, IS_PROF ? 'prof' : 'eleve');
    const db = this.db = app.database(); this.auth = app.auth(); this.root = db.ref('salles/' + ROOM); this.subs = [];

    db.ref('.info/connected').on('value', s => { this.connected = !!s.val(); if(this.connected && this.me) this.writeMe(); renderStatus(); });
    await new Promise(ok => { const un = this.auth.onAuthStateChanged(() => { un(); ok(); }); });
    try{ await this.auth.getRedirectResult(); }catch(e){}
  },
  uid(){ return this.mode === 'firebase' && this.auth && this.auth.currentUser ? this.auth.currentUser.uid : MY_ID; },
  listen(path, cb){
    const ref = this.root.child(path);
    ref.on('value', s => cb(s.val()), err => { console.warn('accès refusé', path, err && err.code); if(this.onDenied) this.onDenied(path); });

  unlistenAll(){ (this.subs || []).forEach(r => r.off()); this.subs = []; },

    this.listen('sounds', v => this.emit('sounds', v || {}));
    this.listen('plan', v => { if(v) this.emit('plan', v); });
    this.listen('state', v => { if(v) this.emit('state', v); });

    this.watchKick();
  },
  subscribeProf(){
    if(this.mode !== 'firebase') return;

  async studentAuth(){ if(!this.auth.currentUser) await this.auth.signInAnonymously(); },
  async readCode(code){ try{ const s = await this.root.child('eleves/' + code).once('value'); return s.val(); }catch(e){ return null; } },
  claimCode(code){ return this.root.child('sessions/' + this.uid()).set(code); },
  async guestStatus(){ // 'ok' | 'ferme' | 'bloque'

  },
  async requestEntry(nom){ const r = this.root.child('attente/' + this.uid()); await r.set({ nom, t:Date.now() }); r.onDisconnect().remove(); },
  // signal « exclu / refusé » : on ignore la valeur déjà présente, on réagit à toute nouvelle valeur

    this.root.child('kick/' + this.uid()).on('value', s => { const v = s.val(); if(first){ first = false; init = v; return; } if(v && v !== init) this.emit('kicked', 1); }, () => {});
  },
  watchAdmis(cb){ this.root.child('admis/' + this.uid()).on('value', s => cb(s.val() === true), () => {}); },
  async profLogin(){
    const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt:'select_account' });

    catch(e){ if(/popup|operation-not-supported/.test(e.code || '')) return this.auth.signInWithRedirect(p); throw e; }
  },
  async profRole(){

  ref(path){ return this.root.child(path); },

  /* --- API commune --- */

  setSounds(v){ if(this.mode === 'firebase') this.root.child('sounds').set(clean(v || {})); else { LS.set(this.ch + '-sounds', v); this.send({ t:'sounds', v }); } },
  setPlan(p){ if(this.mode === 'firebase') this.root.child('plan').set(clean(p)); else { LS.set(this.ch + '-plan', p); this.send({ t:'plan', v:p }); } },
  join(info){

/* ---------- audio (clic généré chez chacun) ---------- */
let ac = null, master = null; const live = [];
function ensureAudio(){
  try{
    if(!ac){ ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = .9; master.connect(ac.destination); }
    if(ac.state !== 'running') ac.resume();
  }catch(e){}
}
function tone(t, f, d, v, type){
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .002); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .02);
  live.push({ o, t }); if(live.length > 300) live.splice(0, 150);
}
function stopFuture(){ if(!ac) return; const n = ac.currentTime; live.forEach(x => { if(x.t > n) try{ x.o.stop(); }catch(e){} }); live.length = 0; }
const SND = {

  count:(t, last) => tone(t, last ? 1760 : 1320, .1, .4, 'triangle'),
  tick:t => tone(t, 880, .07, .3, 'sine'),
  done:t => { [523, 659, 784, 1047].forEach((f, k) => tone(t + k * .09, f, .35, .32, 'triangle')); tone(t + .36, 1568, .5, .12, 'sine'); },

  gong:t => { tone(t, 660, .5, .5, 'sine'); tone(t + .12, 990, .6, .4, 'sine'); },
};

    try{ sampleBuf['custom:' + n] = await ac.decodeAudioData(b64ToU8(b64).buffer); customSrc[n] = b64; }catch(e){ console.warn('custom', n, e); }
  }

function wavB64(pcm, sr){

  for(let i = 0; i < n; i++){ const x = Math.max(-1, Math.min(1, pcm[i])); v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7fff, true); }

async function trimAndEncode(buf){

  let peak = 0; for(let k = 0; k < ch.length; k++){ const a = Math.abs(ch[k]); if(a > peak) peak = a; }
  if(peak < .02) return null;
  const thr = Math.max(peak * .08, .01);
  let a = 0; while(a < ch.length && Math.abs(ch[a]) < thr) a++;
  let z = ch.length - 1; while(z > a && Math.abs(ch[z]) < thr) z--;

/* Traitement : passe-haut + EQ (grave/aigu/présence) + compresseur + gate, puis découpe des silences */
const REC_PRESETS = {
  kick:  { nom:'Kick',   hp:35,  grave:6,  aigu:-2, pres:0, punch:.6, net:.5 },
  snare: { nom:'Snare',  hp:110, grave:0,  aigu:3,  pres:2, punch:.7, net:.5 },
  hihat: { nom:'Hi-hat', hp:500, grave:-6, aigu:5,  pres:1, punch:.4, net:.6 },
  basse: { nom:'Basse',  hp:30,  grave:4,  aigu:-3, pres:0, punch:.5, net:.4 },
  neutre:{ nom:'Neutre', hp:60,  grave:0,  aigu:0,  pres:0, punch:.3, net:.4 },

function guessPreset(d, sr){ // devine le type de son (taux de passage par zéro)
  let z = 0, n = 0, pk = 0; for(let k = 1; k < d.length; k++){ const a = Math.abs(d[k]); if(a > pk) pk = a; }
  for(let k = 1; k < d.length; k++){ if(Math.abs(d[k]) > pk * .05){ n++; if((d[k] >= 0) !== (d[k - 1] >= 0)) z++; } }

function gate(x, sr, net){

let taps = [];
function onTap(){
  ensureAudio();
  const st = S.state, step = st && S.plan && S.plan.steps[st.step];
  if(!st || !st.running || !step || step.type !== 'calage'){ toast('Le TAP marche pendant l\'étape « Calage du son »'); return; }
  const now = Sync.now(); if(taps.length && now - taps[taps.length - 1].t > 6000) taps = [];
  const mpb = 60000 / st.bpm, bar = 4 * mpb;
  const ph = (((now - st.startAt) + st.beat0 * mpb) % bar + bar) % bar; // position du tap dans la mesure du prof (ms)
  taps.push({ t:now, ph }); if(taps.length > 8) taps.shift();
  const left = Math.max(0, 4 - taps.length);
  document.querySelectorAll('.tapinfo').forEach(x => x.textContent = left ? `Encore ${left} tap${left > 1 ? 's' : ''}…` : 'Calé ! Continue à taper pour affiner, ou arrête.');
  if(taps.length >= 4){
    let v = taps.map(x => x.ph);
    if(Math.max(...v) - Math.min(...v) > bar / 2) v = v.map(x => x < bar / 2 ? x + bar : x); // passage de mesure
    v.sort((a, b) => a - b); let d = v[Math.floor(v.length / 2)] % bar;
    if(d > bar - 150) d = 0; // tap légèrement en avance : pas de retard
    setDelay(d);
  }
}

const LEAD = 700;

  if(S.state.step >= S.plan.steps.length) S.state.step = 0;

}
let lastStepSeen = null;
function onStepSeen(){
  const st = S.state, plan = S.plan; if(!st || !plan) return;
  if(lastStepSeen !== null && st.step !== lastStepSeen){
    const step = plan.steps[st.step];
    if(step && step.type === 'fin' && ac && (IS_PROF ? S.profSound : S.sound)){ ensureAudio(); SND.fanfare(ac.currentTime + .05); }
  }
  lastStepSeen = st.step;
}
function pushState(patch){
  S.state = { ...S.state, ...patch, rev:(S.state.rev || 0) + 1, v:APP_VERSION };
  LS.set('bbx-prof-state-' + ROOM, S.state);
  Sync.setState(S.state); renderCtl(); onStepSeen();
}
let planT;
function planChanged(structural){
  LS.set('bbx-prof-plan', S.plan);
  clearTimeout(planT); planT = setTimeout(() => Sync.setPlan(S.plan), 350);
  const st = S.state, step = S.plan.steps[st.step];
  if(step && !st.running && st.beat0 === 0 && stepBpm(step) !== st.bpm) pushState({ bpm:stepBpm(step) });
  if(structural){ if(st.step >= S.plan.steps.length) pushState({ step:S.plan.steps.length - 1, running:false, beat0:0 }); renderEditor(); }
  updateDurations(); renderCtlList();
}
const curStep = () => S.plan.steps[S.state.step];
const A = {
  launch(){
    ensureAudio(); const st = S.state, now = Sync.now(), step = curStep();
    if(!TIMED.has(step.type) || st.running) return;
    if(st.beat0 > 0){ const b0 = step.type === 'echauffement' ? Math.floor(st.beat0) : Math.floor(st.beat0 / 4) * 4; pushState({ running:true, startAt:now + LEAD, beat0:b0 }); }
    else pushState({ running:true, startAt:now + LEAD, beat0:0, courseStart:st.courseStart || now });
  },
  pause(){ const st = S.state; if(!st.running) return; pushState({ running:false, beat0:Math.max(0, beatAt(st, Sync.now())) }); },
  go(i){ i = Math.max(0, Math.min(S.plan.steps.length - 1, i)); { const L = S.plan.steps; let k = i; while(k < L.length - 1 && L[k].off) k++; if(L[k].off){ k = i; while(k > 0 && L[k].off) k--; } i = k; } pushState({ step:i, running:false, beat0:0, startAt:0, bpm:stepBpm(S.plan.steps[i]), micName:'' }); renderQuick(); },
  prev(){ const st = S.plan.steps; for(let k = S.state.step - 1; k >= 0; k--) if(!st[k].off) return A.go(k); },
  next(){ const st = S.plan.steps; for(let k = S.state.step + 1; k < st.length; k++) if(!st[k].off) return A.go(k); },
  restart(){ pushState({ running:false, beat0:0 }); },
  bpm(d){
    const st = S.state; const v = Math.max(40, Math.min(220, st.bpm + d));
    if(st.running){ const T = Sync.now() + 200; pushState({ bpm:v, startAt:T, beat0:beatAt(st, T) }); } else pushState({ bpm:v });
  },
  item(d){
    const st = S.state, step = curStep(), starts = itemStarts(step); if(!starts.length) return;
    if(!st.running && st.beat0 === 0 && d > 0){ toast('Lance d\'abord l\'exercice'); return; }
    const b = st.running ? beatAt(st, Sync.now()) : st.beat0; let idx = -1;
    starts.forEach((x, k) => { if(b >= x - .01) idx = k; });
    const target = d > 0 ? starts[idx + 1] : (idx >= 0 && b - starts[idx] > 6 ? starts[idx] : starts[Math.max(0, idx - 1)]);
    if(target === undefined){ toast('C\'est déjà le dernier'); return; }
    jumpTo(target);
  },
  resetCourse(){ pushState({ step:0, running:false, beat0:0, startAt:0, bpm:stepBpm(S.plan.steps[0]), courseStart:0, micName:'' }); renderQuick(); },
};

const ITEM_LABEL = { tabata:'Son', echauffement:'Exercice', qr:'Phrase', qrlibre:'Échange' };
const LIB_SOUNDS = ['P','Ts','T','K~','K','Pch','Pf','Fsh','Spt','Ts~','Th~','L'];
function itemStarts(step){
  const k = { tabata:'grid', echauffement:'prep', qr:'count', qrlibre:'prof' }[step.type]; if(!k) return [];
  return getTL(step).segs.filter(x => x.kind === k && !(step.type === 'tabata' && x.pal > 0)).map(x => step.type === 'tabata' ? Math.max(0, x.start - 4) : x.start);
}
function jumpTo(target){
  const st = S.state; target = Math.max(0, target);

}
function curSeg(){ const st = S.state, step = curStep(); if(!st || !TIMED.has(step.type)) return null; const b = st.running ? beatAt(st, Sync.now()) : st.beat0; const tl = getTL(step), i = findSeg(tl, b); return i < 0 ? null : tl.segs[i]; }

  const step = curStep(); if(step.type !== 'tabata') return;
  const sg = curSeg(), ti = sg && sg.ti != null ? sg.ti : 0;
  const m = getTL(step).segs.find(x => x.kind === 'grid' && x.ti === ti && x.si === k && x.pal === 0);
  if(!m) return;
  if(!S.state.running && S.state.beat0 === 0){ pushState({ beat0:Math.max(.01, m.start - 4) }); toast('Prêt sur ' + m.son + ' : appuie sur Reprendre'); return; }
  jumpTo(m.start - 4);
}
// Garde la position quand on change les sons pendant que ça tourne
function reanchor(oldStep, newStep){
  const st = S.state, T = Sync.now() + 250, b = beatAt(st, T);
  const o = getTL(oldStep), oi = findSeg(o, b); if(oi < 0) return;
  const sg = o.segs[oi], n = getTL(newStep);
  const ref = sg.kind === 'rest' ? o.segs[oi + 1] : sg.kind === 'grid' ? sg : null;
  let target = b;
  if(ref){
    const m = n.segs.find(x => x.kind === 'grid' && x.ti === ref.ti && x.son === ref.son && x.pal === ref.pal);
    if(m) target = m.start + (b - ref.start);
    else { const nx = n.segs.find(x => x.kind === 'grid' && x.pal === 0 && (x.ti > ref.ti || (x.ti === ref.ti && x.si >= ref.si))); target = nx ? Math.max(0, nx.start - 4) : n.total; }

function bindOutlineDrag(){
  const ul = $('#prep .outline .steps'); if(!ul) return;
  const items = [...ul.querySelectorAll('li[data-jump]')];
  items.forEach(li => li.addEventListener('pointerdown', e => {
    if(e.button > 0) return;
    if(e.pointerType !== 'mouse' && !e.target.closest('.grip')) return; // sur mobile : par la poignée
    const from = +li.dataset.jump, y0 = e.clientY; let dragging = false, ins = from;
    const clear = () => items.forEach(it => it.classList.remove('dropbefore', 'dropafter'));
    const move = ev => {
      const dy = ev.clientY - y0;
      if(!dragging && Math.abs(dy) > 6){ dragging = true; li.classList.add('dragging'); document.body.classList.add('nosel'); }
      if(!dragging) return;
      ev.preventDefault(); li.style.transform = `translateY(${dy}px)`;
      ins = items.length;
      for(let k = 0; k < items.length; k++){ if(k === from) continue; const r = items[k].getBoundingClientRect(); if(ev.clientY < r.top + r.height / 2){ ins = k; break; } }
      clear();
      if(ins !== from && ins !== from + 1){ if(ins < items.length) items[ins].classList.add('dropbefore'); else items[items.length - 1].classList.add('dropafter'); }
    };
    const up = () => {
      removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
      li.style.transform = ''; li.classList.remove('dragging'); document.body.classList.remove('nosel'); clear();
      if(dragging){ dragEndAt = Date.now(); const to = ins > from ? ins - 1 : ins; if(to !== from){ moveStep(from, to); toast('Ordre modifié'); } }
    };
    addEventListener('pointermove', move, { passive:false }); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  }));
}

  const p = S.plan, tot = totalSecs(p);
  const outline = `<aside class="outline card"><div class="row"><b class="f">Déroulé</b><span class="sp"></span><span class="muted small">≈ <span id="totdur2">${fmtMin(tot)}</span></span></div>
    <div class="hint" style="margin-top:4px">Attrape un module et glisse-le pour changer l'ordre.</div><ul class="steps" style="margin-top:6px">${p.steps.map((s, i) => `<li data-jump="${i}" class="${s.off ? 'off2' : ''}" title="Glisse pour changer l'ordre, clique pour y aller"><span class="grip">⠿</span><span class="n">${i + 1}</span><span class="tt">${esc(stepTitle(s))}</span><span class="d dur" data-i="${i}">${s.off ? 'désactivé' : fmtMin(stepSeconds(s))}</span></li>`).join('')}</ul></aside>`;
  el.innerHTML = outline + `<div class="edmain"><div class="card">
      <div class="row"><label class="fld"><span>Titre du cours</span><input data-path="titre" value="${esc(p.titre)}"></label><div><div class="muted small">Durée estimée</div><div class="total" id="totdur">${fmtMin(tot)}</div></div></div>
      <div class="sec dark" style="margin-top:12px">Partir d'un modèle</div>
      <div class="row">${[15, 30, 45, 60].map(m => `<button class="mini" data-act="preset" data-min="${m}">${m} min</button>`).join('')}</div>
      <div class="sec dark" style="margin-top:12px">Partager / sauvegarder</div>
      <div class="row"><button class="mini b-cyan" data-act="shareLink">Copier un lien prof avec ce cours</button><button class="mini" data-act="export">Télécharger (.json)</button><button class="mini" data-act="import">Importer</button><input type="file" id="impfile" accept=".json,application/json" hidden></div>
      <div class="hint" style="margin-top:6px">Le lien prof permet à un autre prof d'ouvrir exactement ce cours, prêt à lancer.</div>
    </div>
    ${p.steps.map((s, i) => `<div class="card ed${s.off ? ' off' : ''}" id="ed-${i}"><div class="edhead"><button class="onoff${s.off ? '' : ' on'}" data-act="toggleoff" data-i="${i}" title="${s.off ? 'Réactiver' : 'Désactiver pour ce cours'}"><i></i></button><span class="type">${i + 1}</span><b>${TYPE_NAMES[s.type]}</b>${s.off ? '<span class="muted small">désactivé</span>' : ''}<span class="muted small dur" data-i="${i}">${fmtMin(stepSeconds(s))}</span><span class="sp"></span>
      <button class="mini b-ghost" data-act="up" data-i="${i}" title="Monter">↑</button><button class="mini b-ghost" data-act="down" data-i="${i}" title="Descendre">↓</button><button class="mini b-ghost" data-act="dup" data-i="${i}" title="Dupliquer">⧉</button><button class="mini b-del" data-act="del" data-i="${i}" title="Supprimer le module">✕</button></div>
      <div class="fields">${fieldsHTML(s, i)}</div></div>`).join('')}
    <div class="card row"><select id="newtype" class="fld" style="flex:0 1 220px;border:2px solid var(--border);border-radius:12px;padding:8px">${Object.entries(TYPE_NAMES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select><button class="b-pink" data-act="addstep">+ Ajouter l'étape</button></div></div>`;
  bindOutlineDrag();
  $('#impfile').onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    f.text().then(t => { S.plan = normPlan(JSON.parse(t)); planChanged(true); A.go(0); toast('Cours importé'); }).catch(() => toast('Fichier illisible'));
  };
}
function onEdInput(e){
  const t = e.target;
  if(t.dataset.path){
    const m = t.dataset.path.match(/^steps\.(\d+)\.phrases\.(\d+)\.(mesures|div)$/);
    if(m){ const ph = S.plan.steps[+m[1]].phrases[+m[2]], oldDiv = phDiv(ph); ph[m[3]] = +t.value; resizePhrase(ph, oldDiv); planChanged(true); return; }
    setPath(S.plan, t.dataset.path, t.type === 'checkbox' ? t.checked : ('num' in t.dataset ? +t.value : t.value));
    planChanged(false);
  } else if(t.dataset.bloc){
    const [i, k] = t.dataset.bloc.split(':'); const s = S.plan.steps[+i]; const set = new Set(arr(s.blocs));
    t.checked ? set.add(k) : set.delete(k); s.blocs = Object.keys(BLOCS).filter(x => set.has(x)); planChanged(true);
  } else if(t.dataset.tpson){ TABED[+t.dataset.tpson].son = t.value; renderEditor();
  } else if(t.dataset.tpdiv){ const i = +t.dataset.tpdiv; tpSave(i, g => ({ div:+t.value, tok:remapTok(g.tok, g.div, +t.value, 4) })); planChanged(true);
  } else if(t.dataset.msg){ const [i, key] = t.dataset.msg.split(':'); const s = S.plan.steps[+i]; s.msgs = s.msgs || {}; s.msgs[key] = t.value; planChanged(false); }
}
function updateDurations(){
  document.querySelectorAll('#prep .dur').forEach(d => { const s = S.plan.steps[+d.dataset.i]; if(s) d.textContent = s.off && d.closest('.outline') ? 'désactivé' : fmtMin(stepSeconds(s)); });
  const t2 = $('#totdur2'); if(t2) t2.textContent = fmtMin(totalSecs(S.plan));
  const t = $('#totdur'); if(t) t.textContent = fmtMin(totalSecs(S.plan));
}

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
function switchToProf(){
  IS_PROF = true;
  try{ history.replaceState(null, '', baseURL() + '?prof&salle=' + encodeURIComponent(ROOM)); }catch(e){}
  profInit();
  if(Sync.mode === 'local' && !Sync.pruneT) Sync.pruneT = setInterval(() => Sync.pruneParts(), 3000);
  Sync.setPlan(S.plan); Sync.setState(S.state); profMain();
}
(async function boot(){
  $('#bgchibi').src = IMG.metro;
  Sync.on('state', v => { if(!IS_PROF){ S.state = v; onStepSeen(); checkVersion(v.v); } });
  Sync.on('plan', v => { if(!IS_PROF){ S.plan = normPlan(v); } });
  Sync.on('sounds', v => { if(!IS_PROF) setCustom(v); });
  Sync.on('parts', v => { S.parts = arr(v); if(IS_PROF) renderParts(); });
  ['eleves', 'attente', 'sessions', 'admis', 'config', 'bloques'].forEach(k => { Sync.h[k] = []; Sync.on(k, v => { S[k] = v || {}; if(IS_PROF) renderParts(); }); });
  Sync.h.kicked = []; Sync.on('kicked', () => studentBlocked(S.joined ? 'Le prof t\'a retiré l\'accès à ce cours.' : 'Le prof n\'a pas accepté ta demande d\'entrée.'));
  Sync.onDenied = path => { if(!IS_PROF && S.joined && ['state', 'plan'].includes(path)) studentBlocked('Ton accès à ce cours a été retiré.'); };
  $('#app').innerHTML = `<div class="join">${LOGO}<div class="sec" style="text-align:center">Connexion…</div></div>`;
  await Sync.init();
  if(IS_PROF) return profStart();
  if(Sync.mode !== 'firebase'){ S.access = 'ok'; return studentJoin(); }
  try{ await Sync.studentAuth(); }catch(e){ return studentBlocked('Connexion impossible (' + (e.code || e.message) + '). Vérifie ta connexion internet.'); }
  if(CODE){
    const el = await Sync.readCode(CODE);
    if(el && el.actif !== false){
      S.myCode = CODE; S.name = el.nom || S.name;
      try{ await Sync.claimCode(CODE); S.access = 'ok'; }catch(e){ S.access = null; S.myCode = null; }
    }
    if(S.access !== 'ok') S.codeError = true;
  }
  studentJoin();
})();
async function profStart(){
  if(Sync.mode === 'firebase'){
    const role = await Sync.profRole();
    if(!role) return profLoginScreen(role === false);
    S.role = role; S.profEmail = Sync.auth.currentUser.email;
  } else S.role = 'admin';
  profInit();
  S.state.v = APP_VERSION; setCustom(LS.get('bbx-custom-sounds', {}));
  Sync.setSounds(CUSTOM); Sync.setPlan(S.plan); Sync.setState(S.state);
  profMain(); Sync.subscribeProf();
}
function profLoginScreen(refused){
  const u = Sync.auth && Sync.auth.currentUser;
  $('#app').innerHTML = `<div class="join">${LOGO}<div class="sec" style="text-align:center">Espace prof · salle ${esc(ROOM)}</div>
    <div class="card">
      ${refused && u && !u.isAnonymous ? `<div class="hint" style="color:#d33">Le compte <b>${esc(u.email)}</b> n'est pas autorisé. Demande au responsable de t'ajouter, ou connecte-toi avec un autre compte.</div>` : `<div class="hint">Connecte-toi avec le compte Google que le responsable a autorisé.</div>`}
      <button class="b-pink b-xl" id="glogin">Se connecter avec Google</button>
      ${u && !u.isAnonymous ? `<button class="mini b-ghost" id="glogout">Se déconnecter (${esc(u.email)})</button>` : ''}
    </div></div>`;
  $('#glogin').onclick = async () => { try{ await Sync.profLogin(); profStart(); }catch(e){ toast('Connexion annulée ou impossible : ' + (e.code || e.message)); } };
  const lo = $('#glogout'); if(lo) lo.onclick = async () => { await Sync.auth.signOut(); profLoginScreen(false); };
}
function studentBlocked(msg){
  S.joined = false; Sync.unlistenAll(); stopFuture();
  $('#app').innerHTML = `<div class="join">${LOGO}<div class="card" style="text-align:center"><div class="h2">${esc(msg)}</div><div class="hint">Si c'est une erreur, contacte ton prof.</div></div></div>`;
}
</script>
