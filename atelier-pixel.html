<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atelier Pixel">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<title>Atelier Pixel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap">
<style>
:root { color-scheme: light; }
html { margin: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; }
</style>
<style>
/* Layout: tool column | square canvas | layers, colour and export panel; on phones and portrait iPad the canvas comes first. */
:root {
  --bg: #e9ecf1;
  --panel: #f7f8fa;
  --fg: #171b26;
  --muted: #5d667a;
  --line: #c8cedb;
  --accent: #0a8f6a;
  --check-a: #dfe3ea;
  --check-b: #cdd3de;
  --grid: rgba(23, 27, 38, 0.2);
  --display: 'Silkscreen', ui-monospace, 'SF Mono', Menlo, monospace;
  --body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c;
    --panel: #1a1e28;
    --fg: #e7eaf1;
    --muted: #98a1b5;
    --line: #2c3342;
    --accent: #3ddc97;
    --check-a: #232938;
    --check-b: #2b3243;
    --grid: rgba(231, 234, 241, 0.16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c;
  --panel: #1a1e28;
  --fg: #e7eaf1;
  --muted: #98a1b5;
  --line: #2c3342;
  --accent: #3ddc97;
  --check-a: #232938;
  --check-b: #2b3243;
  --grid: rgba(231, 234, 241, 0.16);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 14px;
  line-height: 1.4;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 1100px; margin: 0 auto; display: grid; gap: 16px; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: 0.06em; margin: 0; text-transform: uppercase; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
.fld { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }

button, select, .filebtn {
  font: inherit;
  color: var(--fg);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 3px;
  min-height: 40px;
  padding: 0 12px;
  cursor: pointer;
}
.filebtn { display: inline-flex; align-items: center; justify-content: center; text-align: center; }
button:hover, select:hover, .filebtn:hover { border-color: var(--muted); }
button[aria-pressed="true"] {
  background: color-mix(in srgb, var(--accent) 18%, var(--panel));
  border-color: var(--accent);
}
button:disabled { opacity: 0.4; cursor: default; }
button:disabled:hover { border-color: var(--line); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
.primary:hover { border-color: var(--fg); }
input[type="text"] {
  font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
  border-radius: 3px; min-height: 40px; padding: 0 10px; width: 100%; min-width: 0;
}
input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); min-height: 32px; }

.layout { display: grid; grid-template-columns: 64px minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
.tools { display: flex; flex-direction: column; gap: 8px; }
.tool { width: 64px; height: 56px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.tool b { font-family: var(--display); font-weight: 400; font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; }
.tool kbd { font-family: var(--body); font-size: 11px; color: var(--muted); }

.stage, .side { background: var(--panel); border: 1px solid var(--line); min-width: 0; }
.stage { padding: 12px; display: grid; gap: 8px; }
.box { width: 100%; display: flex; justify-content: center; }
canvas#cv { display: block; touch-action: none; image-rendering: pixelated; cursor: crosshair; border: 1px solid var(--line); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
button, select, .filebtn, .stage, .tools { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 20px; }

.side { padding: 0; display: grid; }
.sec { padding: 14px 12px; display: grid; gap: 10px; border-top: 1px solid var(--line); }
.sec:first-child { border-top: 0; }
h2 { font-family: var(--display); font-weight: 400; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0; }

.layers { display: grid; gap: 4px; }
.lrow { display: flex; align-items: center; gap: 4px; }
.eye { width: 40px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.eye input { width: 22px; height: 22px; accent-color: var(--accent); margin: 0; }
.lname { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; text-align: left; min-height: 44px; padding: 4px 8px; }
.lname canvas { flex: none; image-rendering: pixelated; background: var(--check-a); border: 1px solid var(--line); }
.lname span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.lbtns { display: flex; flex-wrap: wrap; gap: 6px; }
.lbtns button { padding: 0 10px; font-size: 13px; }
.lfield { display: grid; gap: 4px; color: var(--muted); }
.lfield.rng { display: flex; align-items: center; gap: 8px; }
#lOpV { min-width: 4ch; text-align: right; font-variant-numeric: tabular-nums; color: var(--fg); }

.colorrow { display: flex; align-items: center; gap: 10px; }
#swatch { width: 44px; height: 40px; border: 1px solid var(--fg); flex: none; }
input[type="color"] { width: 44px; height: 40px; padding: 2px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; border-radius: 3px; }
#hexOut { font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
.palette, .recent { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.sw { aspect-ratio: 1; min-height: 0; padding: 0; border-radius: 2px; }
.sw.sel { outline: 2px solid var(--fg); outline-offset: 1px; }
.none { color: var(--muted); grid-column: 1 / -1; }
.previews { display: flex; align-items: flex-end; gap: 14px; background: var(--bg); padding: 12px; border: 1px solid var(--line); min-height: 64px; flex-wrap: wrap; }
.previews canvas { image-rendering: pixelated; display: block; flex: none; max-width: 100%; height: auto; }
.previews figure { margin: 0; display: grid; gap: 4px; justify-items: start; min-width: 0; max-width: 100%; }
.previews figcaption { color: var(--muted); font-size: 12px; }
.exportrow { display: grid; gap: 8px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.two > * { min-width: 0; }
#exportOut { display: grid; gap: 6px; color: var(--muted); font-size: 12px; }
#exportOut img { image-rendering: pixelated; max-width: 100%; border: 1px solid var(--line); background: var(--bg); }
.hint { color: var(--muted); font-size: 12px; margin: 0; }
[hidden] { display: none !important; }

@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .stage { order: 1; }
  .tools { order: 2; flex-direction: row; flex-wrap: wrap; }
  .tool { width: calc((100% - 40px) / 6); min-width: 52px; }
  .side { order: 3; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Atelier Pixel</h1>
    <div class="bar">
      <label class="fld">Taille <select id="size" aria-label="Taille de la grille"></select></label>
      <button id="mirror" type="button" aria-pressed="false" title="Dessine en symétrie gauche-droite (M)">Miroir</button>
      <button id="gridBtn" type="button" aria-pressed="true">Grille</button>
      <span class="sep" aria-hidden="true"></span>
      <button id="undo" type="button" disabled>Annuler</button>
      <button id="redo" type="button" disabled>Rétablir</button>
      <button id="clear" type="button" title="Efface le calque actif">Effacer le calque</button>
    </div>
  </header>

  <div class="layout">
    <nav class="tools" id="tools" aria-label="Outils">
      <button class="tool" type="button" data-tool="pencil" aria-pressed="true"><b>Crayon</b><kbd>B</kbd></button>
      <button class="tool" type="button" data-tool="eraser" aria-pressed="false"><b>Gomme</b><kbd>E</kbd></button>
      <button class="tool" type="button" data-tool="fill" aria-pressed="false"><b>Remplir</b><kbd>G</kbd></button>
      <button class="tool" type="button" data-tool="picker" aria-pressed="false"><b>Pipette</b><kbd>I</kbd></button>
      <button class="tool" type="button" data-tool="line" aria-pressed="false"><b>Ligne</b><kbd>L</kbd></button>
      <button class="tool" type="button" data-tool="rect" aria-pressed="false"><b>Rect.</b><kbd>R</kbd></button>
    </nav>

    <section class="stage">
      <div class="box" id="box"><canvas id="cv" aria-label="Zone de dessin"></canvas></div>
      <div class="meta"><span id="coords">—</span><span id="msg" role="status"></span></div>
    </section>

    <aside class="side">
      <div class="sec">
        <h2>Calques</h2>
        <div class="layers" id="layers"></div>
        <div class="lbtns">
          <button id="lAdd" type="button">Ajouter</button>
          <button id="lDup" type="button">Dupliquer</button>
          <button id="lUp" type="button">Monter</button>
          <button id="lDown" type="button">Descendre</button>
          <button id="lMerge" type="button" title="Fusionne avec le calque du dessous">Fusionner ↓</button>
          <button id="lDel" type="button">Supprimer</button>
        </div>
        <label class="lfield">Nom <input type="text" id="lNameIn" maxlength="24" autocomplete="off"></label>
        <label class="lfield rng">Opacité <input type="range" id="lOp" min="0" max="100" step="5" value="100"><span id="lOpV">100%</span></label>
      </div>
      <div class="sec">
        <h2>Couleur</h2>
        <div class="colorrow">
          <div id="swatch"></div>
          <input type="color" id="color" value="#ff004d" aria-label="Couleur personnalisée">
          <span id="hexOut">#FF004D</span>
        </div>
        <div class="palette" id="palette"></div>
        <h2>Récentes</h2>
        <div class="recent" id="recent"></div>
      </div>
      <div class="sec">
        <h2>Aperçu</h2>
        <div class="previews">
          <figure><canvas id="pv1" width="16" height="16"></canvas><figcaption>Taille réelle</figcaption></figure>
          <figure><canvas id="pv4" width="16" height="16"></canvas><figcaption>Agrandi</figcaption></figure>
        </div>
      </div>
      <div class="sec">
        <h2>Fichiers</h2>
        <div class="exportrow">
          <label class="fld">Échelle du PNG
            <select id="scale" aria-label="Échelle de l'export PNG">
              <option value="1" selected>×1</option>
              <option value="2">×2</option>
              <option value="4">×4</option>
              <option value="8">×8</option>
              <option value="16">×16</option>
            </select>
          </label>
          <button id="exportBtn" type="button" class="primary">Enregistrer en PNG</button>
          <button id="projBtn" type="button">Enregistrer le projet (calques)</button>
          <div class="two">
            <label class="filebtn" for="openFile">Ouvrir un PNG ou un projet</label>
            <label class="filebtn" for="addFile">Importer en calques</label>
          </div>
          <input type="file" id="openFile" accept="image/*,.json,application/json" hidden>
          <input type="file" id="addFile" accept="image/*" multiple hidden>
          <div id="exportOut" hidden></div>
        </div>
        <p class="hint">Le PNG est l'image à plat des calques visibles, avec transparence. Le projet garde tous les calques pour reprendre plus tard. Images jusqu'à 256 × 256 px. Raccourcis : B E G I L R, M pour le miroir, Ctrl+Z pour annuler.</p>
      </div>
    </aside>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  var COLORS = [
    '#000000', '#1d2b53', '#7e2553', '#008751', '#ab5236', '#5f574f', '#c2c3c7', '#fff1e8',
    '#ff004d', '#ffa300', '#ffec27', '#00e436', '#29adff', '#83769c', '#ff77a8', '#ffccaa',
    '#3e2731', '#7b4a2e', '#c69c6d', '#f2d3ab', '#e8b796', '#d77643', '#f9c22b', '#a8ca58',
    '#4b692f', '#327345', '#0b5e65', '#4fa4b8', '#3b5dc9', '#5d275d', '#b13e53', '#ef7d57'
  ];
  var HEX = /^#[0-9a-f]{6}$/;
  var KEY = 'atelier-pixel-v2';
  var OLD_KEY = 'atelier-pixel-v1';
  var MAX = 256;
  var MAXLAYERS = 32;
  var HISTORY = 60;
  var PNG_PREFIX = 'data:image/png;base64,';
  var SAMPLE_COLORS = { K: '#1d2b53', R: '#ff004d', S: '#ffccaa', B: '#29adff', P: '#ab5236' };
  var SAMPLE = [
    '................',
    '.....KKKKKK.....',
    '....KRRRRRRK....',
    '...KRRRRRRRRK...',
    '...KRRRRRRRRK...',
    '..KKKKKKKKKKKK..',
    '...KSSSSSSSSK...',
    '...KSKSSSSKSK...',
    '...KSSSSSSSSK...',
    '....KSSKKSSK....',
    '...KBBBBBBBBK...',
    '..KBBBBBBBBBBK..',
    '..KSKBBBBBBKSK..',
    '...KKBBBBBBKK...',
    '....KPPKKPPK....',
    '....KKK..KKK....'
  ];

  var sizes = [8, 16, 24, 32, 48, 64, 96, 128];
  var W = 16, H = 16;
  var layers = [];
  var active = 0;
  var nextId = 1;
  var metaStore = {};
  var comp = new Uint32Array(0);
  var compDirty = true;
  var off = document.createElement('canvas');
  var tool = 'pencil';
  var lastDraw = 'pencil';
  var color = '#ff004d';
  var c32 = 0;
  var recent = [];
  var mirror = false;
  var grid = true;
  var undoStack = [];
  var redoStack = [];
  var drawing = false;
  var before = null;
  var baseData = null;
  var start = null;
  var last = null;
  var hover = null;
  var S = 10;
  var dpr = 1;
  var raf = 0;
  var dl = null;
  var msgTimer = 0;
  var pt = 0;
  var ready = false;

  var canvas = $('cv');
  var ctx = canvas.getContext('2d');
  var box = $('box');
  var sizeSel = $('size');
  var pv1 = $('pv1');
  var pv4 = $('pv4');

  /* ---------- small helpers ---------- */
  function msg(text) {
    $('msg').textContent = text;
    clearTimeout(msgTimer);
    msgTimer = setTimeout(function () { $('msg').textContent = ''; }, 5000);
  }
  function setStatus(c) {
    $('coords').textContent = (c ? 'Case ' + (c[0] + 1) + ', ' + (c[1] + 1) + ' · ' : '') + W + ' × ' + H + ' px';
  }
  function h2(v) { return ('0' + v.toString(16)).slice(-2); }
  function toHex(v) { return '#' + h2(v & 255) + h2((v >>> 8) & 255) + h2((v >>> 16) & 255); }
  function fromHex(hex) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
  }
  function baseName(name) {
    var n = String(name || 'Image').replace(/\.[a-z0-9]+$/i, '').trim();
    return (n || 'Image').slice(0, 24);
  }
  function bytesOf(data) { return new Uint8ClampedArray(data.buffer, data.byteOffset, data.byteLength); }
  function place(data, w, h, nw, nh) {
    var out = new Uint32Array(nw * nh);
    var rows = Math.min(h, nh), cols = Math.min(w, nw);
    for (var y = 0; y < rows; y++) out.set(data.subarray(y * w, y * w + cols), y * nw);
    return out;
  }

  /* ---------- layers ---------- */
  function newLayer(name, data) {
    var l = { id: nextId++, name: name, vis: true, op: 1, data: data || new Uint32Array(W * H) };
    setMeta(l);
    return l;
  }
  function setMeta(l) { metaStore[l.id] = { name: l.name, vis: l.vis, op: l.op }; }
  function cur() { return layers[active]; }

  function composite(list, out) {
    var N = W * H;
    var o = out || new Uint32Array(N);
    if (out) o.fill(0);
    for (var k = 0; k < list.length; k++) {
      var l = list[k];
      if (!l.vis || l.op <= 0) continue;
      var d = l.data, op = l.op;
      for (var i = 0; i < N; i++) {
        var s = d[i];
        var sa = s >>> 24;
        if (!sa) continue;
        if (sa === 255 && op >= 1) { o[i] = s; continue; }
        var a = sa * op / 255;
        var dst = o[i];
        var da = (dst >>> 24) / 255;
        var oa = a + da * (1 - a);
        if (oa <= 0) continue;
        var w1 = a / oa, w2 = da * (1 - a) / oa;
        var r = Math.round((s & 255) * w1 + (dst & 255) * w2);
        var g = Math.round(((s >>> 8) & 255) * w1 + ((dst >>> 8) & 255) * w2);
        var b = Math.round(((s >>> 16) & 255) * w1 + ((dst >>> 16) & 255) * w2);
        o[i] = (Math.round(oa * 255) << 24) | (b << 16) | (g << 8) | r;
      }
    }
    return o;
  }
  function ensureComp() {
    var N = W * H;
    if (comp.length !== N) { comp = new Uint32Array(N); compDirty = true; }
    if (compDirty) {
      composite(layers, comp);
      if (off.width !== W) off.width = W;
      if (off.height !== H) off.height = H;
      off.getContext('2d').putImageData(new ImageData(bytesOf(comp), W, H), 0, 0);
      compDirty = false;
    }
  }

  /* ---------- history ---------- */
  function snap() {
    return {
      W: W, H: H, active: active,
      list: layers.map(function (l) { return { id: l.id, name: l.name, vis: l.vis, op: l.op, data: l.data }; })
    };
  }
  function pushState() {
    undoStack.push(snap());
    if (undoStack.length > HISTORY) undoStack.shift();
    redoStack = [];
    updateHistoryButtons();
  }
  function updateHistoryButtons() {
    $('undo').disabled = undoStack.length === 0;
    $('redo').disabled = redoStack.length === 0;
  }
  function restore(s) {
    W = s.W; H = s.H;
    layers = s.list.map(function (e) {
      var m = metaStore[e.id] || e;
      return { id: e.id, name: m.name, vis: m.vis, op: m.op, data: e.data };
    });
    active = Math.min(s.active, layers.length - 1);
    afterStructure();
  }
  function undo() { if (!undoStack.length) return; redoStack.push(snap()); restore(undoStack.pop()); }
  function redo() { if (!redoStack.length) return; undoStack.push(snap()); restore(redoStack.pop()); }

  function afterStructure() {
    syncSizeSelect();
    compDirty = true;
    renderLayers();
    fit();
    persist();
    updateHistoryButtons();
  }

  /* ---------- storage ---------- */
  function layerPng(l) {
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    c.getContext('2d').putImageData(new ImageData(bytesOf(l.data), W, H), 0, 0);
    return c.toDataURL('image/png');
  }
  function persist() {
    clearTimeout(pt);
    pt = setTimeout(doPersist, 600);
  }
  function doPersist() {
    if (!ready) return;
    try {
      localStorage.setItem(KEY, JSON.stringify({
        W: W, H: H, active: active, color: color, recent: recent, mirror: mirror, grid: grid,
        layers: layers.map(function (l) { return { name: l.name, vis: l.vis, op: l.op, png: layerPng(l) }; })
      }));
    } catch (e) { /* storage unavailable or full */ }
  }
  function decodeSrc(src) {
    return new Promise(function (res, rej) {
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight;
        if (!w || !h) { rej(new Error('read')); return; }
        if (w > MAX || h > MAX) { rej(new Error('big')); return; }
        var tc = document.createElement('canvas');
        tc.width = w; tc.height = h;
        var g = tc.getContext('2d');
        g.drawImage(img, 0, 0);
        var id = g.getImageData(0, 0, w, h);
        res({ w: w, h: h, data: new Uint32Array(id.data.buffer) });
      };
      img.onerror = function () { rej(new Error('read')); };
      img.src = src;
    });
  }
  function decodeFile(f) {
    return new Promise(function (res, rej) {
      var rd = new FileReader();
      rd.onerror = function () { rej(new Error('read')); };
      rd.onload = function () { decodeSrc(rd.result).then(res, rej); };
      rd.readAsDataURL(f);
    });
  }
  function validLayerList(list) {
    if (!Array.isArray(list) || list.length < 1 || list.length > MAXLAYERS) return false;
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (!e || typeof e.png !== 'string' || e.png.indexOf(PNG_PREFIX) !== 0) return false;
    }
    return true;
  }

    pushState();
    W = d.W; H = d.H;
    layers = built;
    active = layers.length - 1;
    afterStructure();
    msg('Projet ouvert : ' + layers.length + ' calque' + (layers.length > 1 ? 's' : '') + '.');
  }
  async function importLayers(files) {
    var items = [];
    for (var i = 0; i < files.length; i++) {
      try {
        var r = await decodeFile(files[i]);
        items.push({ name: baseName(files[i].name), r: r });
      } catch (err) {
        msg(errText(err, files[i]));
      }
    }
    if (!items.length) return;
    var room = MAXLAYERS - layers.length;
    if (items.length > room) { items = items.slice(0, Math.max(0, room)); msg('Limite de ' + MAXLAYERS + ' calques atteinte.'); }
    if (!items.length) return;
    pushState();
    var nw = W, nh = H;
    items.forEach(function (it) { nw = Math.max(nw, it.r.w); nh = Math.max(nh, it.r.h); });
    var grew = nw !== W || nh !== H;
    if (grew) resizeAll(nw, nh);
    items.forEach(function (it) {
      var l = newLayer(it.name, place(it.r.data, it.r.w, it.r.h, W, H));
      layers.splice(active + 1, 0, l);
      active++;
    });
    afterStructure();
    msg(items.length + ' calque' + (items.length > 1 ? 's' : '') + ' ajouté' + (items.length > 1 ? 's' : '') + (grew ? ', grille agrandie à ' + W + ' × ' + H + '.' : '.'));
  }
  $('openFile').addEventListener('change', async function (e) {
    var f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try {
      if (/\.json$/i.test(f.name) || f.type === 'application/json') await openProject(f);
      else await openImage(f);
    } catch (err) { msg(errText(err, f)); }
  });
  $('addFile').addEventListener('change', async function (e) {
    var files = e.target.files ? Array.prototype.slice.call(e.target.files) : [];
    e.target.value = '';
    if (!files.length) return;
    try { await importLayers(files); } catch (err) { msg(errText(err)); }
  });

  /* ---------- boot ---------- */
  async function boot() {
    COLORS.forEach(function (hex) { $('palette').appendChild(swatchButton(hex)); });
    var ok = false;
    try { ok = await loadSaved(); } catch (e) { ok = false; }
    if (!ok) loadSample();
    ready = true;
    $('mirror').setAttribute('aria-pressed', String(mirror));
    $('gridBtn').setAttribute('aria-pressed', String(grid));
    renderRecent();
    setColor(color);
    setTool('pencil');
    syncSizeSelect();
    compDirty = true;
    renderLayers();
    fit();
    updateHistoryButtons();

    if (typeof ResizeObserver !== 'undefined') new ResizeObserver(function () { fit(); }).observe(box);
    else window.addEventListener('resize', fit);
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      if (mq.addEventListener) mq.addEventListener('change', function () { draw(true); });
    }
    new MutationObserver(function () { draw(true); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { clearTimeout(pt); doPersist(); }
    });
    window.addEventListener('pagehide', function () { clearTimeout(pt); doPersist(); });
  }
  boot();

  try {
    if (window.claude && window.claude.use) {
      window.claude.use('downloads').then(function (d) { dl = d; }, function () { dl = null; });
    }
  } catch (e) { dl = null; }
})();
</script>
</body>
</html>
